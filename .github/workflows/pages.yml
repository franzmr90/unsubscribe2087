# Publishes the single-player game to GitHub Pages.
#
# It builds from src/ rather than serving the committed dist/, so what goes live is always
# what the sources say — a stale dist/ can never ship by accident.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
name: Publish the game

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.sh', '.github/workflows/pages.yml']
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; let a newer push supersede one that is still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Check it is a real page
        # A truncated or empty build would deploy perfectly happily, so look before shipping.
        run: |
          f=dist/Unsubscribe-2087-standalone.html
          test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          bytes=$(wc -c < "$f")
          echo "built $bytes bytes"
          test "$bytes" -gt 400000 || { echo "::error::only $bytes bytes — the build looks truncated"; exit 1; }
          grep -q '<canvas id="cv">' "$f" || { echo "::error::no game canvas in the output"; exit 1; }
          grep -q '</html>' "$f" || { echo "::error::the file does not end properly"; exit 1; }

      - name: Lay out the site
        # The standalone build is the whole site; it has no other files by design.
        run: |
          mkdir -p _site
          cp dist/Unsubscribe-2087-standalone.html _site/index.html
          cp dist/Unsubscribe-2087-standalone.html _site/Unsubscribe-2087-standalone.html
          # Jekyll would otherwise try to process the output and is not wanted here.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
